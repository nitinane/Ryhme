name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oneatlas_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneatlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oneatlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm exec -- prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run db:seed
      - run: npm exec -- tsx tests/seed-check.ts
      - run: npm run db:seed
      - run: npm exec -- tsx tests/seed-check.ts
      - run: npm run build
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e

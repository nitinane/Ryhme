name: Sync OpenRouter catalog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ryhme-neon-development-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nitinane/Ryhme' && github.ref == 'refs/heads/main' && vars.RYHME_CATALOG_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Synchronize the development catalog
        run: npm run db:sync:openrouter -- --scheduled
        env:
          DIRECT_URL: ${{ secrets.NEON_DEVELOPMENT_CATALOG_DIRECT_URL }}
          RYHME_CATALOG_SYNC_ENABLED: ${{ vars.RYHME_CATALOG_SYNC_ENABLED }}
